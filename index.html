    <meta name="theme-color" content="#0d0b26" />

    <title>Portfolio</title>
    <script>
      // Set the theme before first paint so there is no light/dark flash. Dark is the default.
      (function () {
        try {
          document.documentElement.dataset.theme = localStorage.getItem('portfolio-theme') || 'dark';
        } catch (e) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
